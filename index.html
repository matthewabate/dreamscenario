<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dream Scenario</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: 'Quicksand', system-ui, sans-serif;
      color: #52504E;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: url('images/ds-crowd.jpg') center / cover no-repeat;
    }

    /* ── SHARED TYPOGRAPHY ────────────────────────── */
    .logo {
      width: 40px;
      height: 40px;
      display: block;
      margin-bottom: 5px;
    }

    .brand-name {
      font-weight: 300;
      font-size: 2rem;
      line-height: 1.1;
      letter-spacing: 0.01em;
    }

    .tagline {
      font-weight: 600;
      font-size: 0.6rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #807D7A;
      margin-top: 5px;
    }

    .description {
      font-size: 0.95rem;
      line-height: 1.65;
      font-weight: 500;
      margin-bottom: 20px;
    }

    .divider {
      border: none;
      border-top: 1px solid #C5C1BC;
      margin-bottom: 20px;
    }

    .contact {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .contact a {
      color: #67B261;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .contact a:hover {
      text-decoration: underline;
    }

    .contact .follow {
      color: #52504E;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .copyright {
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #807D7A;
      font-weight: 500;
    }

    /* ══════════════════════════════════════════════
       DESKTOP (≥768px)
       White panel fixed to the left; image fills right.
       Footer copyright lives inside the panel.
    ══════════════════════════════════════════════ */
    @media (min-width: 768px) {
      .site-wrapper {
        flex: 1;
      }

      .panel {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: 370px;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        padding: 40px 40px 20px;
        z-index: 10;
      }

      .panel-body {
        margin-top: auto;
      }

      .panel-footer {
        margin-top: 40px;
      }

      footer {
        display: none;
      }
    }

    /* ══════════════════════════════════════════════
       MOBILE (<768px)
       Card floats over the full-bleed image.
       site-wrapper grows to fill space above footer.
       Footer is a solid white bar pinned to bottom.
    ══════════════════════════════════════════════ */
    @media (max-width: 767px) {
      .site-wrapper {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px 20px 0;
      }

      .panel {
        width: 100%;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        padding: 20px;
      }

      .panel-body {
        margin-top: 40px;
      }

      .panel-footer {
        display: none;
      }

      .brand-name {
        font-size: 1.75rem;
      }

      footer {
        background: #ffffff;
        padding: 20px;
        flex-shrink: 0;
      }
    }
  </style>
</head>

<body>

  <div class="site-wrapper">
    <div class="panel">
      <div class="panel-header">
        <img class="logo" src="images/ds-logo.svg" alt="Dream Scenario logo" />
        <h1 class="brand-name">Dream Scenario</h1>
        <p class="tagline">Human centered.&nbsp; Outcome focused.</p>
      </div>

      <div class="panel-body">
        <p class="description">Dream Scenario is an experience strategy and service design studio working in the NYC Metro area.</p>
        <hr class="divider" />
        <div class="contact">
          <a href="mailto:hello@dreamscenario.studio">hello@dreamscenario.studio</a>
          <span class="follow">Follow us on <a href="https://www.linkedin.com/company/dreamscenario/" target="_blank"
              rel="noopener">LinkedIn</a></span>
        </div>
      </div>

      <div class="panel-footer">
        <p class="copyright">© 2026 • Dream Scenario LLC</p>
      </div>
    </div>
  </div>

  <footer>
    <p class="copyright">© 2026 • Dream Scenario LLC</p>
  </footer>

</body>

</html>
