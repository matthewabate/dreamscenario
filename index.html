<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dream Scenario</title>

  <link rel="icon" type="image/svg+xml" href="images/ds-fav.svg" />
  <meta name="description" content="Dream Scenario is a new problem solving studio in the NYC Metro area." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://dreamscenario.studio/" />
  <meta property="og:title" content="Dream Scenario" />
  <meta property="og:description" content="Dream Scenario is a new problem solving studio in the NYC Metro area." />
  <meta property="og:image" content="https://dreamscenario.studio/images/ds-logo.png" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Dream Scenario" />
  <meta name="twitter:description" content="Dream Scenario is a new problem solving studio in the NYC Metro area." />
  <meta name="twitter:image" content="https://dreamscenario.studio/images/ds-logo.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="styles.css" />

  <style>
    :root { --accent: var(--teal); }

    body {
      background: #3a3835;
      color: #fff;
      /* 84px = fixed header height (18px logo + 2×30px padding) + breathing room */
      padding-top: 84px;
      padding-bottom: 84px;
    }

    .bg-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }

    /* Dark teal overlay over video — var(--dark-rgb) at different opacities */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(var(--dark-rgb), 0.3);
      z-index: -1;
      pointer-events: none;
    }

    /* Gradient behind nav for legibility */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 90px;
      background: linear-gradient(to bottom, rgba(var(--dark-rgb), 0.5) 0%, rgba(var(--dark-rgb), 0) 100%);
      z-index: 1;
      pointer-events: none;
    }

    /* Header: flush to viewport edge on home page */
    header { position: fixed; top: 0; left: 0; right: 0; background: transparent; padding: 30px; }

    /* Nav links: white on home page; underline hover from global attribute selectors */
    nav a { color: #fff; }

    /* Wordmark colors match hero headline */
    .wordmark .wd { color: var(--teal-light); }
    .wordmark .ws { color: #fff; }

    main { text-align: center; }

    .home-headline {
      font-family: 'Abril Fatface', serif;
      font-size: clamp(48px, 7.89vw, 220px);
      line-height: 0.8;
      text-transform: uppercase;
      text-align: center;
      max-width: calc(7.2 * clamp(48px, 7.89vw, 220px));
      margin: 0 auto;
      text-shadow: 0px 3px 9px rgba(0, 0, 0, 0.30);
    }

    .home-headline span   { display: block; }
    .home-headline .teal  { color: var(--teal); }
    .home-headline .teal2 { color: var(--teal-light); }
    .home-headline .wht   { color: #fff; }

    /* Footer color override only — positioning/padding from styles.css */
    footer { color: #fff; }

    @media (max-width: 768px) {
      body { padding: 21px 21px 0; }
      main { padding: 0; }
      .home-headline { font-size: 17vw; max-width: 100%; }
      .hamburger-btn { color: #fff; }
    }
  </style>
</head>
<body>

  <video class="bg-video" autoplay muted loop playsinline>
    <source src="images/Dream-Scenario-Website-Background-720.webm" type="video/webm">
  </video>

  <header>
    <a href="index.html" class="logo-lockup">
      <img src="images/ds-logo.svg" alt="Dream Scenario" />
      <span class="wordmark"><span class="wd">Dream</span><span class="ws">Scenario</span></span>
    </a>
    <nav>
      <a href="practice.html">Practice</a>
      <a href="services.html">Services</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
    <button class="hamburger-btn" id="hamburgerBtn" aria-label="Open menu">
      <span class="material-symbols-outlined">menu</span>
    </button>
  </header>

  <main>
    <h1 class="home-headline">
      <span class="teal">Dream</span>
      <span class="teal2">Scenario</span>
      <span class="wht">is a new problem solving <br>studio</span>
    </h1>
  </main>

  <footer>© 2026 • Dream Scenario LLC</footer>

  <!-- Mobile nav overlay -->
  <div class="nav-overlay" id="navOverlay">
    <div class="nav-overlay-top">
      <a href="index.html"><img src="images/ds-logo.svg" alt="Dream Scenario" /></a>
      <button class="close-btn" id="closeBtn" aria-label="Close menu">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    <nav class="nav-overlay-links">
      <a href="practice.html">Practice</a>
      <a href="services.html">Services</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>

  <script src="nav.js"></script>

</body>
</html>
