 <link rel="preconnect" href="https://fonts.googleapis.com" />

</head>
<body data-page-section="{{SECTION_ID}}">

 <!-- ─── HEADER (fixed, always on top) ─── -->
 <header id="siteHeader">
  <a href="index.html" class="logo-lockup" id="logoLink" data-route data-clean="/">
   <img src="images/ds-logo.svg" alt="Dream Scenario" />
   <span class="wordmark"><span class="wd">Dream</span><span class="ws">Scenario</span></span>
  </a>
  <nav>
   <a href="approach.html" data-section="approach" data-accent="gold" data-route data-clean="/approach.html">Approach</a>
   <a href="services.html" data-section="services" data-accent="pink" data-route data-clean="/services.html">Services</a>
   <a href="studio.html" data-section="studio" data-accent="olive" data-route data-clean="/studio.html">Studio</a>
   <a href="contact.html" data-section="contact" data-accent="teal" data-route data-clean="/contact.html">Contact</a>
  </nav>
  <button class="hamburger-btn" id="hamburgerBtn" aria-label="Open menu">
   <span class="material-symbols-outlined">menu</span>
  </button>
 </header>

 <!-- ─── GRADIENT — fixed layer above sections, below header ─── -->
 <div id="nav-gradient"></div>

 <!-- ─── HERO — fixed behind everything, never re-rendered on navigation ─── -->
 <div id="hero">
  <video class="hero-video" autoplay muted loop playsinline>
   <source src="images/Dream-Scenario-Website-Background-720.webm" type="video/webm">
  </video>
  <div id="hero-text" class="{{OPEN_CLASS}}">
   <div class="hero-content">
    <div class="home-headline" role="heading" aria-level="2">
     <span class="teal">Dream</span>
     <span class="teal2">Scenario</span>
     <span class="wht">is a new problem solving <br>studio</span>
    </div>
   </div>
  </div>
  <div class="hero-footer">© 2026 • Dream Scenario LLC</div>
 </div>

 <!-- ─── SCROLL BODY — slides up over hero on scroll ─── -->
 <div id="scroll-body" class="{{OPEN_CLASS}}">
 <div id="mobile-header-mask"></div>
 <div id="scroll-content">
{{CONTENT}}
 </div><!-- /scroll-content -->

 </div><!-- /scroll-body -->

 <!-- ─── MOBILE NAV OVERLAY ─── -->
 <div class="nav-overlay" id="navOverlay">
  <div class="nav-overlay-top">
   <a href="index.html" id="overlayLogoLink" class="logo-lockup" data-route data-clean="/"><img src="images/ds-logo.svg" alt="Dream Scenario" /><span class="wordmark"><span class="wd">Dream</span><span class="ws">Scenario</span></span></a>

   </button>
  </div>
  <nav class="nav-overlay-links" id="overlayNav">
   <a href="approach.html" data-section="approach" data-accent="gold" data-route data-clean="/approach.html">Approach</a>
   <a href="services.html" data-section="services" data-accent="pink" data-route data-clean="/services.html">Services</a>
   <a href="studio.html" data-section="studio" data-accent="olive" data-route data-clean="/studio.html">Studio</a>
   <a href="contact.html" data-section="contact" data-accent="teal" data-route data-clean="/contact.html">Contact</a>
  </nav>
 </div>

 <script src="router.js" defer></script>
